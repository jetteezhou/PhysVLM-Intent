            if (editingObjectIndex >= 0 && editingObjectPoints[pointIndex]) {
                // 计算归一化坐标
                const relativeX = newX - imageOffsetX;
                const relativeY = newY - imageOffsetY;
                const normalizedX = relativeX / imageRect.width;
                const normalizedY = relativeY / imageRect.height;

                editingObjectPoints[pointIndex].x = normalizedX;
                editingObjectPoints[pointIndex].y = normalizedY;
                editingObjectPoints[pointIndex].displayX = newX;
                editingObjectPoints[pointIndex].displayY = newY;
            }
        }

                draggedMarker = null;
            }

            document.removeEventListener('mousemove', onDrag);
            document.removeEventListener('mouseup', stopDrag);
            
            // 如果在编辑模式下拖动了点，自动更新 SAM3 mask 并保存
            if (wasEditing && editingObjectPoints.length > 0) {
                autoRequestSAMSegment();

            // 如果正在编辑模式，先保存并退出编辑模式
            if (editingObjectIndex >= 0) {
                saveEditingObject();
            }

            // 如果当前有正在编辑的对象且有标注点，先保存到 editingObjects
            if (currentObjectIndex !== -1 && currentObjectPoints.length > 0) {
                const points = currentObjectPoints.map(p => [
                    Math.round(p.y * 1000),  // y坐标 (0-1000)
                    Math.round(p.x * 1000)   // x坐标 (0-1000)
                ]);

                editingObjects.push({
                    name: currentObjectName,
                    points: points,
                    type: currentObjectType

                editingMarkers.forEach(marker => {
                    const markerX = parseFloat(marker.style.left);
                    const markerY = parseFloat(marker.style.top);
                    const isCurrentObjectPoint = currentObjectPoints.some(p => {
                        const expectedX = p.displayX;
                        const expectedY = p.displayY;
                        return Math.abs(markerX - expectedX) < 5 && Math.abs(markerY - expectedY) < 5;

            // 如果正在编辑该对象，先取消编辑

        // 编辑对象（激活点的编辑模式）
        function editObject(index) {
            if (editingObjectIndex >= 0 && editingObjectIndex !== index) {
                if (!confirm('正在编辑其他对象，是否保存当前编辑？')) {
                    saveEditingObject();
                } else {
                    cancelEditingObject();
                }
            }

            editingObjectIndex = index;
            const obj = savedObjects[index];

            // 将对象点转换为可编辑格式
            const imageContainer = document.getElementById('image-container');
            const imageRect = document.getElementById('last-frame-image').getBoundingClientRect();
            const containerRect = imageContainer.getBoundingClientRect();
            const imageOffsetX = (containerRect.width - imageRect.width) / 2;
            const imageOffsetY = (containerRect.height - imageRect.height) / 2;

            editingObjectPoints = obj.points.map(point => {
                const normalizedX = point[1] / 1000;
                const normalizedY = point[0] / 1000;
                const displayX = normalizedX * imageRect.width + imageOffsetX;
                const displayY = normalizedY * imageRect.height + imageOffsetY;

                return {
                    x: normalizedX,
                    y: normalizedY,
                    displayX: displayX,
                    displayY: displayY
                };
            });

            // 清除所有标记并重新渲染
            const markers = imageContainer.querySelectorAll('.point-marker');
            markers.forEach(marker => marker.remove());

            // 渲染其他已保存的对象（非编辑模式）
            savedObjects.forEach((savedObj, objIdx) => {
                if (objIdx !== index) {
                    savedObj.points.forEach((point, pointIdx) => {
                        const normalizedX = point[1] / 1000;
                        const normalizedY = point[0] / 1000;
                        const displayX = normalizedX * imageRect.width + imageOffsetX;
                        const displayY = normalizedY * imageRect.height + imageOffsetY;

                        createPointMarker(
                            { displayX, displayY },
                            objIdx,
                            true,
                            savedObj.name,
                            pointIdx,
                            false
                        );
                    });
                }
            });

            // 渲染正在编辑的对象点（编辑模式）
            editingObjectPoints.forEach((point, idx) => {
                createPointMarker(point, index, false, obj.name, idx, true);
            });

            // 渲染当前正在编辑的新对象点（如果有）
            if (currentObjectIndex >= 0 && currentObjectPoints.length > 0) {
                currentObjectPoints.forEach((point, idx) => {
                    createPointMarker(point, currentObjectIndex, false, currentObjectName, idx, false);
                });
            }

            // 显示取消按钮（保存编辑按钮已隐藏，改为自动保存）
            document.getElementById('save-editing-btn').style.display = 'none';
            document.getElementById('cancel-editing-btn').style.display = 'inline-block';

            updateObjectsList();
            showStatus(`正在编辑对象: ${obj.name}，可以拖动点进行编辑，点击图像添加新点，点击点后按Delete删除（修改后会自动保存）`, 'success');
        }

        function saveEditingObject() {
            if (editingObjectIndex < 0 || editingObjectPoints.length === 0) {
                return;
            }

            saveHistory();

            // 更新对象点数据
            const points = editingObjectPoints.map(p => [
                Math.round(p.y * 1000),  // y坐标 (0-1000)
                Math.round(p.x * 1000)   // x坐标 (0-1000)
            ]);

            savedObjects[editingObjectIndex].points = points;

            // 退出编辑模式
            editingObjectIndex = -1;
            editingObjectPoints = [];

            // 隐藏保存和取消按钮
            document.getElementById('save-editing-btn').style.display = 'none';
            document.getElementById('cancel-editing-btn').style.display = 'none';

            // 重新渲染
            const imageContainer = document.getElementById('image-container');
            const markers = imageContainer.querySelectorAll('.point-marker');
            markers.forEach(marker => marker.remove());

            renderSavedObjects();
            if (currentObjectIndex >= 0 && currentObjectPoints.length > 0) {
                currentObjectPoints.forEach((point, idx) => {
                    createPointMarker(point, currentObjectIndex, false, currentObjectName, idx);
                });
            }

            // 重新渲染 mask（因为点已经更新，mask 也应该更新）
            renderExistingMasks();

            updateObjectsList();
            updateStats();
            
            // 自动保存到文件（静默保存）
            scheduleAutoSave();

            showStatus('已取消编辑', 'success');

        // 自动保存
        function scheduleAutoSave() {
            if (autoSaveTimer) {
                clearTimeout(autoSaveTimer);
            }

            autoSaveTimer = setTimeout(() => {
                if (!currentVideo) return;
                
                const taskTemplate = document.getElementById('task-template').value.trim();
                const scene = document.getElementById('scene').value.trim();

                if (!taskTemplate || !scene) return;
                
                // 如果有已保存的对象，或者正在编辑对象，或者正在创建新对象，则保存
                if (savedObjects.length > 0 || editingObjectIndex >= 0 || (currentObjectIndex >= 0 && currentObjectPoints.length > 0)) {
                    saveAnnotations(true); // 静默保存
                }
            }, 2000); // 2秒后自动保存（缩短延迟，提高响应速度）
        }

            setTimeout(() => {
                // 方法1: 直接滚动到容器底部（最快）
                const parentContainer = container.parentElement;
                if (parentContainer && parentContainer.scrollHeight > parentContainer.clientHeight) {
                    parentContainer.scrollTop = parentContainer.scrollHeight;
                }

                // 方法2: 滚动到最后一个对象项（备用方法）
                const lastItem = container.lastElementChild;
                if (lastItem) {
                    lastItem.scrollIntoView({ behavior: 'auto', block: 'end', inline: 'nearest' });
                } else {
                    // 如果没有子元素，滚动到容器本身
                    container.scrollIntoView({ behavior: 'auto', block: 'end', inline: 'nearest' });
                }
            }, 50); // 减少延迟时间从100ms到50ms
        }

        // 渲染已保存的对象标记点（包括已保存的和正在编辑的对象）
        // 渲染已保存的对象（优化：使用缓存的rect和批量创建）
        function renderSavedObjects() {
            invalidateRectCache(); // 使缓存失效，重新获取
            const { containerRect, imageRect } = getCachedRects();
            if (!containerRect || !imageRect) return;

            const imageOffsetX = (containerRect.width - imageRect.width) / 2;
            const imageOffsetY = (containerRect.height - imageRect.height) / 2;

            // 使用requestAnimationFrame批量渲染，减少重排
            requestAnimationFrame(() => {
                // 渲染已保存的对象
                savedObjects.forEach((obj, objIndex) => {
                    obj.points.forEach((point, pointIdx) => {
                        // point格式应该是 [y, x] 归一化坐标 (0-1000)
                        const normalizedX = point[1] / 1000;
                        const normalizedY = point[0] / 1000;

                        const displayX = normalizedX * imageRect.width + imageOffsetX;
                        const displayY = normalizedY * imageRect.height + imageOffsetY;

                        // 创建已保存的标记点
                        createPointMarker(
                            { displayX, displayY },
                            objIndex,
                            true, // isSaved = true
                            obj.name,
                            pointIdx
                        );
                    });
                });

                // 渲染正在编辑的对象（已标注点但未保存的对象）
                editingObjects.forEach((obj, objIndex) => {
                    obj.points.forEach((point, pointIdx) => {
                        // point格式应该是 [y, x] 归一化坐标 (0-1000)
                        const normalizedX = point[1] / 1000;
                        const normalizedY = point[0] / 1000;

                        const displayX = normalizedX * imageRect.width + imageOffsetX;
                        const displayY = normalizedY * imageRect.height + imageOffsetY;

                        // 创建正在编辑的标记点（使用已保存的样式，但标记为待保存）
                        createPointMarker(
                            { displayX, displayY },
                            savedObjects.length + objIndex,
                            true, // isSaved = true（使用已保存样式）
                            obj.name,
                            pointIdx
                        );
                    });
                });
            });
        }

        // 保存标注（保存所有对象到文件，包括正在编辑的对象）
        async function saveAnnotations(silent = false) {
            if (!currentVideo) {
                showStatus('请先选择视频', 'error');
                return;
            }

            // 如果正在编辑模式，先保存并退出编辑模式
            if (editingObjectIndex >= 0) {
                saveEditingObject();
            }

            // 检查是否是无效视频
            const annotationKey = `${folderPath}|${currentVideo.name}`;
            const existingAnnotation = annotations[annotationKey];

            // 收集所有要保存的对象（包括已保存的、正在编辑的和当前正在编辑的对象）
            // 注意：如果正在编辑对象，saveEditingObject() 已经更新了 savedObjects 中的点数据
            
            const allObjectsToSave = [...savedObjects, ...editingObjects];

            // 如果有当前正在编辑的对象，也添加到保存列表
            if (currentObjectIndex !== -1 && currentObjectPoints.length > 0) {
                const points = currentObjectPoints.map(p => [
                    Math.round(p.y * 1000),  // y坐标 (0-1000)
                    Math.round(p.x * 1000)   // x坐标 (0-1000)
                ]);

                const currentObjectData = {
                    name: currentObjectName,
                    points: points,
                    type: currentObjectType,
                    mask: window.currentObjectMask || null // 保存当前生成的 Mask
                };

                allObjectsToSave.push(currentObjectData);
            }

            if (existingAnnotation && existingAnnotation.is_invalid) {
                // 如果之前标记为无效，现在要保存正常标注，需要清除无效标记
                // 继续执行保存流程
            } else if (allObjectsToSave.length === 0) {
                showStatus('请先添加至少一个目标对象或放置区域', 'error');
                return;
            }

            const taskTemplate = document.getElementById('task-template').value.trim();
            const scene = document.getElementById('scene').value.trim();

            // 更新全局变量
            globalTaskTemplate = taskTemplate;
            globalScene = scene;

            if (!taskTemplate || !scene) {
                showStatus('请填写任务指令模板和场景', 'error');
                return;
            }

            // 构建标注数据
            const annotationId = existingAnnotation?.id || Date.now().toString();

            // 使用所有对象列表（包括正在编辑的对象）
            const annotationData = {
                id: annotationId,
                folder: folderPath,
                video_name: currentVideo.name,
                task_template: taskTemplate,
                scene: scene,
                object_space: allObjectsToSave,  // 保存所有对象（包括正在编辑的）
                is_invalid: false,  // 明确标记为非无效视频
                asr_result: currentASRResult  // 保存完整的ASR结果（包括句子级别和词汇级别）
            };

            annotations[annotationKey] = annotationData;

            // 打印保存标注的交互信息
            console.log(`[标注交互] 保存标注到文件`, {
                video: currentVideo.name,
                folder: folderPath,
                task_template: taskTemplate,
                scene: scene,
                objects_count: allObjectsToSave.length,
                objects: allObjectsToSave.map(obj => ({
                    name: obj.name,
                    type: obj.type || 'object',
                    points_count: obj.points.length
                })),
                timestamp: new Date().toISOString()
            });

            try {
                const response = await fetch('/api/simple_annotation/save_annotations', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify({
                        folder_path: folderPath,
                        annotations: annotations
                    })
                });

                if (!response.ok) {
                    throw new Error('保存失败');
                }

                // 保存成功后，将所有正在编辑的对象保存到 savedObjects，并重置状态
                // 先将 editingObjects 中的对象保存到 savedObjects
                savedObjects.push(...editingObjects);

                // 如果有当前正在编辑的对象，也保存到 savedObjects
                if (currentObjectIndex !== -1 && currentObjectPoints.length > 0) {
                    const points = currentObjectPoints.map(p => [
                        Math.round(p.y * 1000),
                        Math.round(p.x * 1000)
                    ]);
                    savedObjects.push({
                        name: currentObjectName,
                        points: points,
                        type: currentObjectType
                    });
                }

                // 清空所有临时编辑状态
                editingObjects = [];
                currentObjectIndex = -1;
                currentObjectPoints = [];
                currentObjectName = '';
                currentObjectType = 'object';
                selectedPointIndex = -1;

                // 重新渲染标记点
                const imageContainer = document.getElementById('image-container');
                const markers = imageContainer.querySelectorAll('.point-marker');
                markers.forEach(marker => marker.remove());
                renderSavedObjects();
                updateObjectsList();

                if (!silent) {
                    showStatus('标注保存成功！', 'success');
                    // 更新标注数据后，自动跳转到下一个未标注的视频
                    displayVideoList();
                    updateProgress();
                    updateStats();
                    // 延迟一下再跳转，确保状态已更新
                    setTimeout(() => {
                        jumpToNextUnannotated();
                    }, 500);
                } else {
                    displayVideoList();
                    updateProgress();
                    updateStats();
                }
            } catch (error) {
                showStatus('保存失败: ' + error.message, 'error');
            }
        }

        // 跳转到下一个未标注的视频（从当前视频之后开始）
        function jumpToNextUnannotated() {
            // 从当前视频的下一个开始查找
            const startIndex = currentVideoIndex >= 0 ? currentVideoIndex + 1 : 0;

            for (let i = startIndex; i < videos.length; i++) {
                const video = videos[i];
                const annotationKey = `${folderPath}|${video.name}`;
                const annotation = annotations[annotationKey];
                const isInvalid = annotation && annotation.is_invalid === true;
                const objectSpaceList = annotation ? (annotation.object_space || annotation.objects || []) : [];
                const isAnnotated = objectSpaceList.length > 0;

                // 跳过无效视频和已标注的视频
                if (!isInvalid && !isAnnotated) {
                    selectVideo(i);
                    return;
                }
            }

            // 如果从当前位置往后没找到，从头开始查找
            for (let i = 0; i < startIndex; i++) {
                const video = videos[i];
                const annotationKey = `${folderPath}|${video.name}`;
                const annotation = annotations[annotationKey];
                const isInvalid = annotation && annotation.is_invalid === true;
                const objectSpaceList = annotation ? (annotation.object_space || annotation.objects || []) : [];
                const isAnnotated = objectSpaceList.length > 0;

                // 跳过无效视频和已标注的视频
                if (!isInvalid && !isAnnotated) {
                    selectVideo(i);
                    return;
                }
            }

            showStatus('所有视频都已标注或标记为无效', 'success');
        }

        // 跳转到未标注的视频
        function jumpToUnannotated() {
            for (let i = 0; i < videos.length; i++) {

                const annotationKey = `${folderPath}|${video.name}`;
                const annotation = annotations[annotationKey];
                const objectSpaceList = annotation ? (annotation.object_space || annotation.objects || []) : [];
                const isAnnotated = objectSpaceList.length > 0;

                }

            showStatus('所有视频都已标注', 'success');
        }

        // ==================== SAM3 分割功能 ====================

        // 自动请求 SAM3 分割（带去抖动，支持编辑模式）
        function autoRequestSAMSegment() {
            // 清除之前的定时器
            if (samDebounceTimer) {
                clearTimeout(samDebounceTimer);
            }

            // 设置新的定时器
            samDebounceTimer = setTimeout(async () => {
                if (!currentVideo) {
                    return;
                }

                // 检查当前对象类型，如果是放置区域，则不进行分割
                if (editingObjectIndex >= 0) {
                    const editingObj = savedObjects[editingObjectIndex];
                    if (editingObj && editingObj.type === 'space') {
                        console.log('[SAM3] 当前正在编辑放置区域，跳过自动分割');
                        return;
                    }
                } else if (currentObjectType === 'space') {
                    console.log('[SAM3] 当前正在标注放置区域，跳过自动分割');
                    return;
                }

                // 收集点：优先使用编辑模式下的点，否则使用当前创建对象的点
                let allPoints = [];
                
                if (editingObjectIndex >= 0 && editingObjectPoints.length > 0) {
                    // 编辑模式下，使用编辑对象的点
                    allPoints = editingObjectPoints.map(p => [p.x, p.y]);
                } else if (currentObjectPoints.length > 0) {
                    // 创建新对象模式下，使用当前对象的点
                    allPoints = currentObjectPoints.map(p => [p.x, p.y]);
                } else {
                    return; // 没有点，不请求
                }

                // 显示加载状态
                isSAMLoading = true;
                showSAMStatus('🔄 正在请求 SAM3 分割...', 'loading');

                try {
                    const response = await fetch('/api/simple_annotation/sam_segment', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({
                            folder_path: folderPath,
                            video_name: currentVideo.name,
                            points: allPoints,
                            point_labels: allPoints.map(() => 1)
                        })
                    });

                    const data = await response.json();

                    if (!response.ok) {
                        throw new Error(data.error || '请求失败');
                    }

                    if (data.success && data.mask_image_url) {
                        samMaskUrl = data.mask_image_url;
                        const maskOverlay = document.getElementById('sam-mask-overlay');
                        maskOverlay.src = data.mask_image_url + '?t=' + Date.now();
                        maskOverlay.style.display = 'block';
                        samMaskVisible = true;
                        document.getElementById('sam-toggle-btn').textContent = '👁️ 隐藏 SAM Mask (M)';
                        showSAMStatus(`✅ ${data.message}`, 'success');
                        console.log('[SAM3] 自动分割成功:', data);
                        
                        // 如果在编辑模式下，保存 mask 数据到编辑对象
                        if (editingObjectIndex >= 0 && data.mask) {
                            if (!savedObjects[editingObjectIndex]) {
                                console.warn('[SAM3] 编辑对象索引无效:', editingObjectIndex);
                            } else {
                                savedObjects[editingObjectIndex].mask = data.mask;
                                console.log('[SAM3] 已更新编辑对象的 mask 数据:', {
                                    object_index: editingObjectIndex,
                                    object_name: savedObjects[editingObjectIndex].name,
                                    mask_score: data.mask.score,
                                    mask_bbox: data.mask.bbox
                                });
                                // mask 更新后自动保存
                                scheduleAutoSave();
                            }
                        } else if (data.mask) {
                            // 如果是创建新对象模式，暂存 mask 数据
                            window.currentObjectMask = data.mask;
                            console.log('[SAM3] 已暂存新对象的 mask 数据:', {
                                mask_score: data.mask.score,
                                mask_bbox: data.mask.bbox
                            });
                            // mask 更新后自动保存
                            scheduleAutoSave();
                        }
                    } else {
                        showSAMStatus('⚠️ ' + (data.message || '未检测到分割结果'), 'warning');
                    }
                } catch (error) {
                    console.error('[SAM3] 自动分割失败:', error);
                    showSAMStatus('❌ 分割失败: ' + error.message, 'error');
                } finally {
                    isSAMLoading = false;
                }
            }, SAM_DEBOUNCE_DELAY);
        }

        // 请求 SAM3 分割
        async function requestSAMSegment() {
            if (!currentVideo) {
                showStatus('请先选择视频', 'error');
                return;
            }

            // 检查当前对象类型，如果是放置区域，则不进行分割
            if (editingObjectIndex >= 0) {
                const editingObj = savedObjects[editingObjectIndex];
                if (editingObj && editingObj.type === 'space') {
                    showStatus('放置区域无需分割', 'warning');
                    return;
                }
            } else if (currentObjectType === 'space') {
                showStatus('放置区域无需分割', 'warning');
                return;
            }

            // 收集所有当前对象的点
            const allPoints = [];

            // 优先使用编辑模式下的点
            if (editingObjectIndex >= 0 && editingObjectPoints.length > 0) {
                editingObjectPoints.forEach(p => {
                    allPoints.push([p.x, p.y]);
                });
            } else if (currentObjectPoints.length > 0) {
                // 否则使用当前创建对象的点
                currentObjectPoints.forEach(p => {
                    allPoints.push([p.x, p.y]);
                });
            }

            // 如果没有点，提示用户
            if (allPoints.length === 0) {
                showStatus('请先添加至少一个标注点', 'error');
                return;
            }

            // 显示加载状态
            isSAMLoading = true;
            showSAMStatus('🔄 正在请求 SAM3 分割...', 'loading');
            document.getElementById('sam-request-btn').disabled = true;

            try {
                const response = await fetch('/api/simple_annotation/sam_segment', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify({
                        folder_path: folderPath,
                        video_name: currentVideo.name,
                        points: allPoints,
                        point_labels: allPoints.map(() => 1)  // 全部为前景点
                    })
                });

                const data = await response.json();

                if (!response.ok) {
                    throw new Error(data.error || '请求失败');
                }

                if (data.success && data.mask_image_url) {
                    // 保存 mask URL
                    samMaskUrl = data.mask_image_url;

                    // 显示 mask
                    const maskOverlay = document.getElementById('sam-mask-overlay');
                    maskOverlay.src = data.mask_image_url + '?t=' + Date.now();  // 添加时间戳避免缓存
                    maskOverlay.style.display = 'block';
                    samMaskVisible = true;

                    // 更新按钮文字
                    document.getElementById('sam-toggle-btn').textContent = '👁️ 隐藏 SAM Mask (M)';

                    showSAMStatus(`✅ ${data.message}`, 'success');
                    console.log('[SAM3] 分割成功:', data);
                    
                    // 如果在编辑模式下，保存 mask 数据到编辑对象
                    if (editingObjectIndex >= 0 && data.mask) {
                        if (!savedObjects[editingObjectIndex]) {
                            console.warn('[SAM3] 编辑对象索引无效:', editingObjectIndex);
                        } else {
                            savedObjects[editingObjectIndex].mask = data.mask;
                            console.log('[SAM3] 已更新编辑对象的 mask 数据:', {
                                object_index: editingObjectIndex,
                                object_name: savedObjects[editingObjectIndex].name,
                                mask_score: data.mask.score,
                                mask_bbox: data.mask.bbox
                            });
                            // mask 更新后自动保存
                            scheduleAutoSave();
                        }
                    } else if (data.mask) {
                        // 如果是创建新对象模式，暂存 mask 数据
                        window.currentObjectMask = data.mask;
                        // mask 更新后自动保存
                        scheduleAutoSave();
                    }
                } else {
                    showSAMStatus('⚠️ ' + (data.message || '未检测到分割结果'), 'warning');
                }

            } catch (error) {
                console.error('[SAM3] 分割失败:', error);
                showSAMStatus('❌ 分割失败: ' + error.message, 'error');
            } finally {
                isSAMLoading = false;
                document.getElementById('sam-request-btn').disabled = false;
            }
        }

        // 切换 SAM Mask 显示/隐藏
        function toggleSAMMask() {
            const maskOverlay = document.getElementById('sam-mask-overlay');
            const toggleBtn = document.getElementById('sam-toggle-btn');

            if (samMaskVisible) {
                // 隐藏 mask
                maskOverlay.style.display = 'none';
                samMaskVisible = false;
                toggleBtn.textContent = '🎭 显示 SAM Mask (M)';
            } else {
                // 显示 mask（如果有）
                if (samMaskUrl) {
                    maskOverlay.style.display = 'block';
                    samMaskVisible = true;
                    toggleBtn.textContent = '👁️ 隐藏 SAM Mask (M)';
                } else {
                    showSAMStatus('⚠️ 请先点击"请求 SAM3 分割"按钮生成 mask', 'warning');
                }
            }
        }

        // 显示 SAM 状态信息
        function showSAMStatus(message, type) {
            const statusDiv = document.getElementById('sam-status');
            statusDiv.textContent = message;
            statusDiv.style.display = 'block';

            // 设置样式
            statusDiv.style.background = type === 'success' ? '#d4edda' :
                type === 'error' ? '#f8d7da' :
                    type === 'warning' ? '#fff3cd' :
                        '#e2e3e5';
            statusDiv.style.color = type === 'success' ? '#155724' :
                type === 'error' ? '#721c24' :
                    type === 'warning' ? '#856404' :
                        '#383d41';

            // 3秒后自动隐藏（除了loading状态）
            if (type !== 'loading') {
                setTimeout(() => {
                    statusDiv.style.display = 'none';
                }, 3000);
            }
        }

        // 重置 SAM 状态（切换视频时调用）
        function resetSAMState() {
            samMaskVisible = false;
            samMaskUrl = null;
            isSAMLoading = false;

            const maskOverlay = document.getElementById('sam-mask-overlay');
            if (maskOverlay) {
                maskOverlay.style.display = 'none';
                maskOverlay.src = '';
            }

            const toggleBtn = document.getElementById('sam-toggle-btn');
            if (toggleBtn) {
                toggleBtn.textContent = '🎭 显示 SAM Mask (M)';
            }

            const statusDiv = document.getElementById('sam-status');
            if (statusDiv) {
                statusDiv.style.display = 'none';
            }
        }
    </script>
</body>

</html>

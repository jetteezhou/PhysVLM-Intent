        // 滚动到对象列表底部
        function scrollToObjectsListBottom() {
            const container = document.getElementById('objects-list');
            if (!container) return;
            
            // 等待 DOM 更新完成（减少延迟时间）
            setTimeout(() => {
                // 方法1: 直接滚动到容器底部（最快）
                const parentContainer = container.parentElement;
                if (parentContainer && parentContainer.scrollHeight > parentContainer.clientHeight) {
                    parentContainer.scrollTop = parentContainer.scrollHeight;
                }
                
                // 方法2: 滚动到最后一个对象项（备用方法）
                const lastItem = container.lastElementChild;
                if (lastItem) {
                    lastItem.scrollIntoView({ behavior: 'auto', block: 'end', inline: 'nearest' });
                } else {
                    // 如果没有子元素，滚动到容器本身
                    container.scrollIntoView({ behavior: 'auto', block: 'end', inline: 'nearest' });
                }
            }, 50); // 减少延迟时间从100ms到50ms
        }

        // 加载视频的标注数据
        function loadVideoAnnotations() {
            if (!currentVideo) return;

            const annotationKey = `${folderPath}|${currentVideo.name}`;
            const annotation = annotations[annotationKey];

            // 清除现有标记
            const imageContainer = document.getElementById('image-container');
            const markers = imageContainer.querySelectorAll('.point-marker');
            markers.forEach(marker => marker.remove());

            // 重置已保存对象列表
            savedObjects = [];

            // 检查是否是无效视频
            if (annotation && annotation.is_invalid === true) {
                // 清空所有字段（但保留全局任务模板和场景）
                // 不在这里清空任务模板和场景，让它们保留全局值
                currentObjectIndex = -1;
                currentObjectPoints = [];
                currentObjectName = '';
                currentObjectType = 'object'; // 重置对象类型
                updateObjectsList();
                showStatus('此视频已标记为无效视频', 'error');
                return;
            }

            // 兼容旧的objects字段和新的object_space字段
            const objectSpaceList = annotation ? (annotation.object_space || annotation.objects || []) : [];
            
            if (!annotation || objectSpaceList.length === 0) {
                // 清空所有字段和显示
                currentObjectIndex = -1;
                currentObjectPoints = [];
                currentObjectName = '';
                currentObjectType = 'object'; // 重置对象类型
                savedObjects = []; // 确保清空已保存对象列表
                
                // 如果是未标注的视频，保留全局任务模板和场景的值
                // 如果全局值存在，则使用全局值；否则清空
                if (!annotation) {
                    if (globalTaskTemplate) {
                        document.getElementById('task-template').value = globalTaskTemplate;
                    } else {
                        document.getElementById('task-template').value = '';
                    }
                    if (globalScene) {
                        document.getElementById('scene').value = globalScene;
                    } else {
                        document.getElementById('scene').value = '';
                    }
                }
                
                // 清空ASR结果显示
                document.getElementById('asr-text-content').style.display = 'none';
                document.getElementById('asr-error').style.display = 'none';
                document.getElementById('asr-loading').style.display = 'none';
                currentASRResult = null;
                
                updateObjectsList();
                return;
            }

            // 加载标注的对象
            // 先设置任务模板和场景
            if (annotation.task_template) {
                document.getElementById('task-template').value = annotation.task_template;
                globalTaskTemplate = annotation.task_template; // 更新全局变量
            }
            if (annotation.scene) {
                document.getElementById('scene').value = annotation.scene;
                globalScene = annotation.scene; // 更新全局变量
            }

            // 加载ASR结果
            if (annotation.asr_result) {
                currentASRResult = annotation.asr_result;
                // 显示ASR识别结果（支持多个句子）
                displayASRResult(currentASRResult);
            } else {
                currentASRResult = null;
                // 如果没有ASR结果，清空显示
                document.getElementById('asr-text-content').style.display = 'none';
                document.getElementById('asr-error').style.display = 'none';
                document.getElementById('asr-loading').style.display = 'none';
            }

            console.log(`[标注交互] 加载已有标注`, {
                video: currentVideo.name,
                annotation_id: annotation.id,
                task_template: annotation.task_template,
                scene: annotation.scene,
                objects_count: objectSpaceList.length,
                has_asr_result: !!annotation.asr_result,
                timestamp: new Date().toISOString()
            });

            // 保存已加载的对象到savedObjects，确保包含type字段
            savedObjects = objectSpaceList.map(obj => ({
                name: obj.name || '',
                points: obj.points || [],
                type: obj.type || 'object'  // 如果没有type字段，默认为'object'（兼容旧数据）
            }));

            // 为每个已保存的对象创建标记点
            renderSavedObjects();

            // 显示对象列表
            updateObjectsList();
        }

        // 渲染已保存的对象标记点（包括已保存的和正在编辑的对象）
        function renderSavedObjects() {
            const imageContainer = document.getElementById('image-container');
            const imageRect = document.getElementById('last-frame-image').getBoundingClientRect();
            const containerRect = imageContainer.getBoundingClientRect();
            
            const imageOffsetX = (containerRect.width - imageRect.width) / 2;
            const imageOffsetY = (containerRect.height - imageRect.height) / 2;

            // 渲染已保存的对象
            savedObjects.forEach((obj, objIndex) => {
                obj.points.forEach((point, pointIdx) => {
                    // point格式应该是 [y, x] 归一化坐标 (0-1000)
                    const normalizedX = point[1] / 1000;
                    const normalizedY = point[0] / 1000;
                    
                    const displayX = normalizedX * imageRect.width + imageOffsetX;
                    const displayY = normalizedY * imageRect.height + imageOffsetY;
                    
                    // 创建已保存的标记点
                    createPointMarker(
                        { displayX, displayY },
                        objIndex,
                        true, // isSaved = true
                        obj.name,
                        pointIdx
                    );
                });
            });

            // 渲染正在编辑的对象（已标注点但未保存的对象）
            editingObjects.forEach((obj, objIndex) => {
                obj.points.forEach((point, pointIdx) => {
                    // point格式应该是 [y, x] 归一化坐标 (0-1000)
                    const normalizedX = point[1] / 1000;
                    const normalizedY = point[0] / 1000;
                    
                    const displayX = normalizedX * imageRect.width + imageOffsetX;
                    const displayY = normalizedY * imageRect.height + imageOffsetY;
                    
                    // 创建正在编辑的标记点（使用已保存的样式，但标记为待保存）
                    createPointMarker(
                        { displayX, displayY },
                        savedObjects.length + objIndex,
                        true, // isSaved = true（使用已保存样式）
                        obj.name,
                        pointIdx
                    );
                });
            });
        }


        // 改变播放速度
        function changePlaybackSpeed() {
            const videoPlayer = document.getElementById('video-player');
            const speed = parseFloat(document.getElementById('playback-speed').value);
            videoPlayer.playbackRate = speed;
        }

        // 标记为无效视频
        async function markAsInvalidVideo() {
            if (!currentVideo) {
                showStatus('请先选择视频', 'error');
                return;
            }

            if (!confirm('确定要将此视频标记为无效视频吗？标记后所有字段将被清空。')) {
                return;
            }

            // 清空所有字段
            savedObjects = [];
            currentObjectIndex = -1;
            currentObjectPoints = [];
            currentObjectName = '';
            currentObjectType = 'object'; // 重置对象类型
            selectedPointIndex = -1;
            editingObjectIndex = -1;
            editingObjectPoints = [];
            currentASRResult = null; // 清空ASR结果
            
            // 清空任务模板和场景
            document.getElementById('task-template').value = '';
            document.getElementById('scene').value = '';
            
            // 清除所有标记点
            const imageContainer = document.getElementById('image-container');
            const markers = imageContainer.querySelectorAll('.point-marker');
            markers.forEach(marker => marker.remove());
            
            // 隐藏编辑按钮
            document.getElementById('save-editing-btn').style.display = 'none';
            document.getElementById('cancel-editing-btn').style.display = 'none';
            
            // 清空ASR结果显示
            document.getElementById('asr-text-content').style.display = 'none';
            document.getElementById('asr-error').style.display = 'none';
            document.getElementById('asr-loading').style.display = 'none';
            
            // 更新UI
            updateObjectsList();
            updateStats();
            
            // 构建标注数据（标记为无效）
            const annotationKey = `${folderPath}|${currentVideo.name}`;
            const existingAnnotation = annotations[annotationKey];
            const annotationId = existingAnnotation?.id || Date.now().toString();

            const annotationData = {
                id: annotationId,
                folder: folderPath,
                video_name: currentVideo.name,
                task_template: '',
                scene: '',
                object_space: [],  // 字段名改为object_space
                is_invalid: true,  // 标记为无效视频
                asr_result: null  // 清空ASR结果
            };

            annotations[annotationKey] = annotationData;
            
            console.log(`[标注交互] 标记为无效视频`, {
                video: currentVideo.name,
                folder: folderPath,
                timestamp: new Date().toISOString()
            });

            try {
                const response = await fetch('/api/simple_annotation/save_annotations', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify({
                        folder_path: folderPath,
                        annotations: annotations
                    })
                });

                if (!response.ok) {
                    throw new Error('保存失败');
                }

                showStatus('已标记为无效视频', 'success');
                displayVideoList();
                updateProgress();
                updateStats();
                
                // 延迟一下再跳转，确保状态已更新
                setTimeout(() => {
                    jumpToNextUnannotated();
                }, 500);
            } catch (error) {
                showStatus('保存失败: ' + error.message, 'error');
            }
        }

        // 保存标注（保存所有对象到文件，包括正在编辑的对象）
        async function saveAnnotations(silent = false) {
            if (!currentVideo) {
                showStatus('请先选择视频', 'error');
                return;
            }

            // 检查是否是无效视频
            const annotationKey = `${folderPath}|${currentVideo.name}`;
            const existingAnnotation = annotations[annotationKey];
            
            // 收集所有要保存的对象（包括已保存的、正在编辑的和当前正在编辑的对象）
            const allObjectsToSave = [...savedObjects, ...editingObjects];
            
            // 如果有当前正在编辑的对象，也添加到保存列表
            if (currentObjectIndex !== -1 && currentObjectPoints.length > 0) {
                const points = currentObjectPoints.map(p => [
                    Math.round(p.y * 1000),  // y坐标 (0-1000)
                    Math.round(p.x * 1000)   // x坐标 (0-1000)
                ]);

                const currentObjectData = {
                    name: currentObjectName,
                    points: points,
                    type: currentObjectType
                };
                
                allObjectsToSave.push(currentObjectData);
            }
            
            if (existingAnnotation && existingAnnotation.is_invalid) {
                // 如果之前标记为无效，现在要保存正常标注，需要清除无效标记
                // 继续执行保存流程
            } else if (allObjectsToSave.length === 0) {
                showStatus('请先添加至少一个目标对象或放置空间', 'error');
                return;
            }

            const taskTemplate = document.getElementById('task-template').value.trim();
            const scene = document.getElementById('scene').value.trim();
            
            // 更新全局变量
            globalTaskTemplate = taskTemplate;
            globalScene = scene;

            if (!taskTemplate || !scene) {
                showStatus('请填写任务指令模板和场景', 'error');
                return;
            }

            // 构建标注数据
            const annotationId = existingAnnotation?.id || Date.now().toString();

            // 使用所有对象列表（包括正在编辑的对象）
            const annotationData = {
                id: annotationId,
                folder: folderPath,
                video_name: currentVideo.name,
                task_template: taskTemplate,
                scene: scene,
                object_space: allObjectsToSave,  // 保存所有对象（包括正在编辑的）
                is_invalid: false,  // 明确标记为非无效视频
                asr_result: currentASRResult  // 保存完整的ASR结果（包括句子级别和词汇级别）
            };

            annotations[annotationKey] = annotationData;
            
            // 打印保存标注的交互信息
            console.log(`[标注交互] 保存标注到文件`, {
                video: currentVideo.name,
                folder: folderPath,
                task_template: taskTemplate,
                scene: scene,
                objects_count: allObjectsToSave.length,
                objects: allObjectsToSave.map(obj => ({
                    name: obj.name,
                    type: obj.type || 'object',
                    points_count: obj.points.length
                })),
                timestamp: new Date().toISOString()
            });

            try {
                const response = await fetch('/api/simple_annotation/save_annotations', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify({
                        folder_path: folderPath,
                        annotations: annotations
                    })
                });

                if (!response.ok) {
                    throw new Error('保存失败');
                }

                // 保存成功后，将所有正在编辑的对象保存到 savedObjects，并重置状态
                // 先将 editingObjects 中的对象保存到 savedObjects
                savedObjects.push(...editingObjects);
                
                // 如果有当前正在编辑的对象，也保存到 savedObjects
                if (currentObjectIndex !== -1 && currentObjectPoints.length > 0) {
                    const points = currentObjectPoints.map(p => [
                        Math.round(p.y * 1000),
                        Math.round(p.x * 1000)
                    ]);
                    savedObjects.push({
                        name: currentObjectName,
                        points: points,
                        type: currentObjectType
                    });
                }
                
                // 清空所有临时编辑状态
                editingObjects = [];
                currentObjectIndex = -1;
                currentObjectPoints = [];
                currentObjectName = '';
                currentObjectType = 'object';
                selectedPointIndex = -1;
                
                // 重新渲染标记点
                const imageContainer = document.getElementById('image-container');
                const markers = imageContainer.querySelectorAll('.point-marker');
                markers.forEach(marker => marker.remove());
                renderSavedObjects();
                updateObjectsList();

                if (!silent) {
                    showStatus('标注保存成功！', 'success');
                    // 更新标注数据后，自动跳转到下一个未标注的视频
                    displayVideoList();
                    updateProgress();
                    updateStats();
                    // 延迟一下再跳转，确保状态已更新
                    setTimeout(() => {
                        jumpToNextUnannotated();
                    }, 500);
                } else {
                    displayVideoList();
                    updateProgress();
                    updateStats();
                }
            } catch (error) {
                showStatus('保存失败: ' + error.message, 'error');
            }
        }

        // 跳转到下一个未标注的视频（从当前视频之后开始）
        function jumpToNextUnannotated() {
            // 从当前视频的下一个开始查找
            const startIndex = currentVideoIndex >= 0 ? currentVideoIndex + 1 : 0;
            
            for (let i = startIndex; i < videos.length; i++) {
                const video = videos[i];
                const annotationKey = `${folderPath}|${video.name}`;
                const annotation = annotations[annotationKey];
                const isInvalid = annotation && annotation.is_invalid === true;
                const objectSpaceList = annotation ? (annotation.object_space || annotation.objects || []) : [];
                const isAnnotated = objectSpaceList.length > 0;
                
                // 跳过无效视频和已标注的视频
                if (!isInvalid && !isAnnotated) {
                    selectVideo(i);
                    return;
                }
            }
            
            // 如果从当前位置往后没找到，从头开始查找
            for (let i = 0; i < startIndex; i++) {
                const video = videos[i];
                const annotationKey = `${folderPath}|${video.name}`;
                const annotation = annotations[annotationKey];
                const isInvalid = annotation && annotation.is_invalid === true;
                const objectSpaceList = annotation ? (annotation.object_space || annotation.objects || []) : [];
                const isAnnotated = objectSpaceList.length > 0;
                
                // 跳过无效视频和已标注的视频
                if (!isInvalid && !isAnnotated) {
                    selectVideo(i);
                    return;
                }
            }
            
            showStatus('所有视频都已标注或标记为无效', 'success');
        }

        // 跳转到未标注的视频
        function jumpToUnannotated() {
            for (let i = 0; i < videos.length; i++) {
                const video = videos[i];
                const annotationKey = `${folderPath}|${video.name}`;
                const annotation = annotations[annotationKey];
                const objectSpaceList = annotation ? (annotation.object_space || annotation.objects || []) : [];
                const isAnnotated = objectSpaceList.length > 0;
                
                if (!isAnnotated) {
                    selectVideo(i);
                    return;
                }
            }
            
            showStatus('所有视频都已标注', 'success');
        }

        // 显示状态消息
        function showStatus(message, type) {
            const statusDiv = document.getElementById('status-message');
            statusDiv.textContent = message;
            statusDiv.className = `status-message status-${type}`;
            statusDiv.style.display = 'block';
            
            setTimeout(() => {
                statusDiv.style.display = 'none';
            }, 3000);
        }

        // 显示/隐藏加载动画
        function showLoading(show) {
            document.getElementById('loading').style.display = show ? 'block' : 'none';
        }

        // 显示ASR识别结果（支持多个句子）
        function displayASRResult(asrResult) {
            if (!asrResult) {
                document.getElementById('asr-text-content').style.display = 'none';
                document.getElementById('asr-error').style.display = 'none';
                document.getElementById('asr-loading').style.display = 'none';
                return;
            }

            // 如果有完整文本，直接显示
            if (asrResult.text && asrResult.text.trim()) {
                document.getElementById('asr-text-content').textContent = asrResult.text;
                document.getElementById('asr-text-content').style.display = 'block';
                document.getElementById('asr-error').style.display = 'none';
                document.getElementById('asr-loading').style.display = 'none';
            } 
            // 如果有多个句子，合并显示
            else if (asrResult.sentences && asrResult.sentences.length > 0) {
                const fullText = asrResult.sentences.map(s => s.text).join(' ');
                document.getElementById('asr-text-content').textContent = fullText;
                document.getElementById('asr-text-content').style.display = 'block';
                document.getElementById('asr-error').style.display = 'none';
                document.getElementById('asr-loading').style.display = 'none';
            }
            // 如果有单个句子（兼容旧格式）
            else if (asrResult.sentence && asrResult.sentence.text) {
                document.getElementById('asr-text-content').textContent = asrResult.sentence.text;
                document.getElementById('asr-text-content').style.display = 'block';
                document.getElementById('asr-error').style.display = 'none';
                document.getElementById('asr-loading').style.display = 'none';
            }
            else {
                document.getElementById('asr-text-content').style.display = 'none';
                document.getElementById('asr-error').style.display = 'block';
                document.getElementById('asr-error').textContent = '⚠️ 未识别到语音内容';
                document.getElementById('asr-loading').style.display = 'none';
            }
        }
    </script>
